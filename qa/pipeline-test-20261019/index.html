<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas><script>
const W=1080,H=1920,FPS=30,SCENE=12,c=document.getElementById('c'),q=c.getContext('2d');
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
function renderScene(t){const r=rng(42);q.fillStyle='#14213d';q.fillRect(0,0,W,H);
 for(let i=0;i<60;i++){const x=r()*W,y=r()*H,s=2+r()*4;q.fillStyle='rgba(255,255,255,.6)';q.beginPath();q.arc(x+Math.sin(t+i)*6,y,s,0,7);q.fill()}
 const u=ease(Math.min(1,(t%2)/1.2)),cx=200+680*u;q.fillStyle='#ffb703';q.beginPath();q.arc(cx,960,120,0,7);q.fill();q.fillStyle='#fb8500';q.beginPath();q.arc(cx,960,60,0,7);q.fill();}
function renderCrisp(t){q.fillStyle='#fff';q.textAlign='center';q.font='800 64px Manrope';q.fillText('scene t='+t.toFixed(3),540,1000+260);}
window.renderFrame=i=>{const out=i/FPS,st=Math.floor((out+1e-8)*SCENE)/SCENE;renderScene(st);renderCrisp(st);return st};
window.ready=(async()=>{const f=new FontFace('Manrope','url(Manrope800.ttf)',{weight:'800'});await f.load();document.fonts.add(f);await document.fonts.ready;return true})();
</script></body></html>
